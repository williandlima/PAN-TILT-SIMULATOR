[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pantiltsim"
version = "0.2.0"
description = "Simulador do Pan-Tilt PTU-D300E (protocolo ASCII do fabricante) via RS-485 e USB, com GUI PyQt5"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
dev = ["pytest>=7.0", "pyflakes>=3.0"]

[project.scripts]
ptu-sim = "pantiltsim.main:main"

[tool.setuptools.packages.find]
include = ["pantiltsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
